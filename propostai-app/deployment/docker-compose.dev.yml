version: "3.9"

services:
  postgres-propostai:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: propostai
      POSTGRES_USER: propostai
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propostai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-propostai:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

volumes:
  pgdata_dev:
