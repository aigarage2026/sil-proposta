[project]
name = "propostai"
version = "1.0.0"
description = "Gerador de Propostas SAP com IA Multi-Agente — Plataforma SaaS AI Garage"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    # Cache / Sessions
    "redis>=5.0.0",
    # Auth
    # pyjwt[crypto] pulls in `cryptography`, required for RS256/JWKS
    # validation (v3 §6 dual mode).
    "pyjwt[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.0",
    # Pin bcrypt < 4.1 — passlib 1.7.x crashes during backend init with
    # bcrypt 4.1+ (`ValueError: password cannot be longer than 72 bytes`)
    # because of the 73-byte detect_wrap_bug() probe.
    "bcrypt<4.1",
    # Rate limiting
    "slowapi>=0.1.9",
    # Logging + Observability
    "structlog>=24.0.0",
    # Prometheus /metrics (v3 §15.3)
    "prometheus-client>=0.20.0",
    # Sentry error tracking (v3 §15.5)
    "sentry-sdk[fastapi]>=2.0.0",
    # Document generation
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    # LLM
    "anthropic>=0.39.0",
    # Async
    "aiofiles>=23.2.1",
    # Scheduler
    "apscheduler>=3.10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Flat layout: there's no single root package, so list the top-level
# modules explicitly. tests/, scripts/, data/, migrations/ are intentionally
# left out of the install — they're either runtime data, dev tooling, or
# alembic-generated.
include = ["apis*", "core*", "integrations*", "models*", "schemas*", "services*"]
exclude = ["tests*", "scripts*", "data*", "migrations*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    # Test-only fakes:
    "aiosqlite>=0.20.0",
    "fakeredis>=2.20.0",
]
qdrant = [
    "qdrant-client>=1.12.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# E712 (== True) is the standard SQLAlchemy idiom for boolean column comparisons;
# `.is_(True)` is equivalent but uglier and not what the codebase uses.
ignore = ["E712"]

[tool.ruff.lint.per-file-ignores]
# Late router imports in main.py are intentional — they run after FastAPI
# is constructed so middleware order is preserved.
"main.py" = ["E402"]
# Tests have long inline payloads and locally-rebound variables; we don't
# want to litter them with noqa.
"tests/**/*.py" = ["E501"]
# Seed / demo / agent prompt files are mostly inline data + Portuguese
# narratives — wrapping them does not improve clarity.
"scripts/**/*.py" = ["E501"]
"services/propostai/demo_generation_service.py" = ["E501"]
"services/propostai/agents/**/*.py" = ["E501"]
"core/security.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: testes unitarios isolados",
    "integration: testes com banco real",
    "api: testes de endpoint via TestClient",
    "service: testes de service layer",
    "isolation: testes de isolamento cross-tenant",
    "propostai: testes do dominio",
    "fsm: state machine do agente IA",
    "ai: integracao com Portal",
    "slow: testes lentos (> 1s)",
    "regression: bugs ja corrigidos",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
