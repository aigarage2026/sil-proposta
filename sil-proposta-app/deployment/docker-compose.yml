networks:
  sil-proposta-network:
    driver: bridge

volumes:
  sil_proposta_pgdata:
  sil_proposta_redisdata:
  sil_proposta_documents:

services:
  postgres-sil-proposta:
    image: postgres:16-alpine
    networks: [sil-proposta-network]
    volumes: [sil_proposta_pgdata:/var/lib/postgresql/data]
    environment:
      POSTGRES_DB: sil_proposta
      POSTGRES_USER: sil_proposta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sil_proposta"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-sil-proposta:
    image: redis:7-alpine
    networks: [sil-proposta-network]
    volumes: [sil_proposta_redisdata:/data]
    command: redis-server --appendonly yes
    restart: unless-stopped

  migration:
    # Build context is the app root so we can copy backend/ and (later)
    # shared/ libraries with consistent paths.
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    networks: [sil-proposta-network]
    command: alembic upgrade head
    depends_on:
      postgres-sil-proposta:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://sil_proposta:${POSTGRES_PASSWORD:-secret}@postgres-sil-proposta:5432/sil_proposta

  backend-sil-proposta:
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    networks: [sil-proposta-network]
    depends_on:
      migration:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://sil_proposta:${POSTGRES_PASSWORD:-secret}@postgres-sil-proposta:5432/sil_proposta
      REDIS_URL: redis://redis-sil-proposta:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AGENT_HUB_API_URL: ${AGENT_HUB_API_URL:-https://app.ai-garage.com.br}
      AGENT_HUB_API_KEY: ${AGENT_HUB_API_KEY:-}
      STORAGE_BASE_PATH: /data/sil_proposta
      DEBUG: "false"
    volumes:
      - sil_proposta_documents:/data/sil_proposta
    restart: unless-stopped

  frontend-sil-proposta:
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
    networks: [sil-proposta-network]
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend-sil-proposta
    restart: unless-stopped
