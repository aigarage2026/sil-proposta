[project]
name = "sil-proposta"
version = "1.0.0"
description = "Gerador de Propostas SAP com IA Multi-Agente — Plataforma SaaS AI Garage"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    # Cache / Sessions
    "redis>=5.0.0",
    # Auth
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.0",
    # Pin bcrypt < 4.1 — passlib 1.7.x crashes during backend init with
    # bcrypt 4.1+ (`ValueError: password cannot be longer than 72 bytes`)
    # because of the 73-byte detect_wrap_bug() probe.
    "bcrypt<4.1",
    # Rate limiting
    "slowapi>=0.1.9",
    # Logging
    "structlog>=24.0.0",
    # Document generation
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    # LLM
    "anthropic>=0.39.0",
    # Async
    "aiofiles>=23.2.1",
    # Scheduler
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
qdrant = [
    "qdrant-client>=1.12.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: testes unitarios isolados",
    "integration: testes com banco real",
    "api: testes de endpoint via TestClient",
    "service: testes de service layer",
    "isolation: testes de isolamento cross-tenant",
    "sil_proposta: testes do dominio",
    "fsm: state machine do agente IA",
    "ai: integracao com Portal",
    "slow: testes lentos (> 1s)",
    "regression: bugs ja corrigidos",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
