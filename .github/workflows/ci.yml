name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sil-proposta-app/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sil-proposta-app/backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # `[dev]` pulls in pytest, ruff, mypy, plus aiosqlite/fakeredis
          # for the test fixtures.
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        env:
          # Same env the test fixtures use; PORTAL_HMAC_SECRET unblocks
          # tests that monkeypatch it but want the default to be non-empty.
          PORTAL_HMAC_SECRET: ci-portal-secret
          DEBUG: "true"
        run: pytest -q --no-header

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sil-proposta-app/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sil-proposta-app/frontend/package-lock.json

      - name: Install dependencies
        # Prefer npm ci when a lockfile is present; fall back to npm install
        # so the workflow still works on first commit before the lockfile
        # lands in the repo.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint (eslint)
        run: npm run lint --if-present

      - name: Build (vite)
        run: npm run build
